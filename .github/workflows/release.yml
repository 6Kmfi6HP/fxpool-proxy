name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  GO_VERSION: "1.25.x"
  IMAGE_NAME: ghcr.io/6kmfi6hp/fxpool-proxy

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ $tag =~ $semver ]] || { echo "Invalid SemVer tag: $tag" >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag commit must belong to main" >&2
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Shell syntax
        run: bash -n install.sh

  binaries:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            format: tar.gz
          - goos: darwin
            goarch: amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            format: tar.gz
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME}
          package="fxpool-proxy_${version}_${GOOS}_${GOARCH}"
          binary=fxpool-proxy
          [[ $GOOS == windows ]] && binary=fxpool-proxy.exe
          mkdir -p "stage/$package" dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${version}" \
            -o "stage/$package/$binary" ./cmd/fxpool-proxy
          cp README.md LICENSE "stage/$package/"
          [[ $GOOS != linux ]] || cp install.sh "stage/$package/"
          if [[ $FORMAT == zip ]]; then
            (cd stage && zip -q -r "../dist/${package}.zip" "$package")
          else
            tar -C stage -czf "dist/${package}.tar.gz" "$package"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          docker_version=${version//+/-}
          stable=true
          [[ $version != *-* ]] || stable=false
          {
            echo 'value<<EOF'
            echo "${IMAGE_NAME}:${docker_version}"
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"
            if [[ $stable == true ]]; then
              IFS=. read -r major minor patch <<<"$version"
              echo "${IMAGE_NAME}:${major}.${minor}"
              echo "${IMAGE_NAME}:${major}"
              echo "${IMAGE_NAME}:latest"
            fi
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum fxpool-proxy_* > checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          [[ $GITHUB_REF_NAME != *-* ]] || args+=(--prerelease)
          gh "${args[@]}"
